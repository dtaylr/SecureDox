name: platform-iac

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-iac:
    name: platform and iac checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Install tools
        run: |
          mkdir -p reports
          python -m pip install --upgrade pip
          python -m pip install checkov ansible pyyaml
          # tests/requirements.txt pins pytest plus the plugins the root
          # pyproject requires (asyncio_mode is rejected under --strict-config
          # without pytest-asyncio) and the deps tests/conftest.py imports.
          python -m pip install -r tests/requirements.txt
          ansible-galaxy collection install -r infra/ansible/requirements.yml
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o /tmp/install-trivy.sh
          sh /tmp/install-trivy.sh -b /usr/local/bin

      - name: Terraform format and validate
        run: |
          make terraform-fmt
          make terraform-validate

      - name: Ansible syntax
        run: make ansible-check

      - name: Trivy IaC scan
        run: make iac-scan

      - name: Checkov IaC scan
        run: make checkov

      - name: Architecture asset tests
        run: python -m pytest tests/architecture -v --junitxml=reports/junit-architecture.xml

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-iac-evidence
          path: |
            reports/trivy-config.json
            reports/checkov.json
            reports/junit-architecture.xml
          if-no-files-found: warn
