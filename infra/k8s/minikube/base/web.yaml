apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: securedox
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: docker.io/securedox/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - { name: VITE_API_BASE_URL, value: "http://securedox.local" }
            - { name: HOME, value: /tmp }
            - { name: NPM_CONFIG_CACHE, value: /tmp/npm-cache }
          command: ["npm"]
          args: ["run", "dev", "--", "--cacheDir", "/tmp/vite-cache"]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: securedox
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
