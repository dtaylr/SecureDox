version: 1
name: securedox-container-policy

images:
  fail_on:
    severity:
      - CRITICAL
  require:
    non_root_user: true
    no_latest_tag: true
    healthcheck: true
    minimal_base_image: true

dockerfiles:
  lint:
    tool: hadolint
    failure_threshold: warning
  paths:
    - apps/api/Dockerfile
    - apps/worker/Dockerfile
    - apps/web/Dockerfile
