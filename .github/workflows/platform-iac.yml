name: platform-iac

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-iac:
    name: platform and iac checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov ansible pytest pyyaml
          ansible-galaxy collection install -r infra/ansible/requirements.yml
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Terraform format and validate
        run: |
          make terraform-fmt
          make terraform-validate

      - name: Ansible syntax
        run: make ansible-check

      - name: Trivy IaC scan
        run: make iac-scan

      - name: Checkov IaC scan
        run: make checkov

      - name: Architecture asset tests
        run: python -m pytest tests/architecture -v --junitxml=reports/junit-architecture.xml

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-iac-evidence
          path: |
            reports/trivy-config.json
            reports/checkov.json
            reports/junit-architecture.xml
          if-no-files-found: warn
