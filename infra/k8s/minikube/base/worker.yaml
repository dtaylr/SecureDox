apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: securedox
  annotations:
    checkov.io/skip1: CKV_K8S_15=Minikube uses preloaded local images with IfNotPresent.
    checkov.io/skip2: CKV_K8S_35=The worker reads local development secrets from environment variables.
    checkov.io/skip3: CKV_K8S_43=Local development images are mutable and are not pinned by digest.
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: docker.io/securedox/worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
          envFrom:
            - configMapRef: { name: securedox-config }
            - secretRef: { name: securedox-secrets }
          env:
            - { name: LOG_LEVEL, value: INFO }
            - { name: LOG_FORMAT, value: json }
          readinessProbe:
            tcpSocket: { port: 9100 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9100 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - { name: worker-storage, mountPath: /var/lib/securedox/storage }
            - { name: worker-tmp, mountPath: /tmp }
      volumes:
        - { name: worker-storage, emptyDir: {} }
        - { name: worker-tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: securedox
spec:
  selector: { app: worker }
  ports:
    - port: 9100
      targetPort: 9100
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: securedox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
