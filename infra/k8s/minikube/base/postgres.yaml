apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: securedox
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: securedox }
            - { name: POSTGRES_DB, value: securedox }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securedox-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "securedox", "-d", "securedox"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "securedox", "-d", "securedox"]
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: securedox
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
