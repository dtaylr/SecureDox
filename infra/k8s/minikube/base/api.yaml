apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: securedox
  annotations:
    checkov.io/skip1: CKV_K8S_15=Minikube uses preloaded local images with IfNotPresent.
    checkov.io/skip2: CKV_K8S_35=The app reads local development secrets from environment variables.
    checkov.io/skip3: CKV_K8S_43=Local development images are mutable and are not pinned by digest.
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      containers:
        - name: api
          image: docker.io/securedox/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: securedox-config }
            - secretRef: { name: securedox-secrets }
          env:
            - { name: LOG_LEVEL, value: INFO }
            - { name: LOG_FORMAT, value: json }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - { name: api-storage, mountPath: /var/lib/securedox/storage }
            - { name: api-tmp, mountPath: /tmp }
      volumes:
        - { name: api-storage, emptyDir: {} }
        - { name: api-tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: securedox
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: securedox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
