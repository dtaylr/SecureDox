name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-security:
    name: static security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scanner CLIs
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit semgrep
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Install project dependencies
        run: |
          yarn install --frozen-lockfile || yarn install
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r tests/requirements.txt

      - name: Pre-commit security hooks
        run: pre-commit run gitleaks semgrep hadolint-docker --all-files

      - name: Secret scan
        run: make secrets

      - name: SAST
        run: make sast

      - name: Dependency scan
        run: make sca

      - name: npm/yarn/OSV audit
        run: make dep-audit

      - name: SBOM
        run: make sbom

      - name: Dockerfile lint
        run: make dockerfile-lint

      - name: IaC scan
        run: make iac-scan

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            reports/
            security/sbom/
          if-no-files-found: warn

  container-security:
    name: container image scan
    runs-on: ubuntu-latest
    needs: static-security
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Prepare env
        run: cp .env.example .env

      - name: Build and scan images
        run: make image-scan

      - name: Upload container scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-evidence
          path: reports/trivy-images.json
          if-no-files-found: warn

  release-security-policy:
    name: release security policy
    runs-on: ubuntu-latest
    needs: [static-security, container-security]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download static evidence
        uses: actions/download-artifact@v4
        with:
          name: security-evidence
          path: .

      - name: Download container evidence
        uses: actions/download-artifact@v4
        with:
          name: container-security-evidence
          path: reports

      - name: Install gate runner
        run: yarn install --frozen-lockfile || yarn install

      - name: Evaluate release security policy
        run: yarn gate:security
