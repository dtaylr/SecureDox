apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: securedox
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: securedox/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - { name: VITE_API_BASE_URL, value: http://securedox.local }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: securedox
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
