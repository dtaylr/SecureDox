name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-security:
    name: static security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install scanner CLIs
        env:
          # Pinned to the versions the gate thresholds were validated against.
          # A floating scanner can add findings overnight and fail the gate on
          # an unrelated commit, which is indistinguishable from a real
          # regression. Bumping these is a deliberate, reviewable change.
          GITLEAKS_VERSION: "8.30.1"
          SYFT_VERSION: "v1.51.0"
          TRIVY_VERSION: "v0.70.0"
          SEMGREP_VERSION: "1.172.0"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pre-commit "semgrep==${SEMGREP_VERSION}"
          # gitleaks no longer ships install.sh — both master/ and main/ return
          # 404, so the previous curl aborted this step before any scanner was
          # installed. Take the release tarball directly.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh -o /tmp/install-syft.sh
          sh /tmp/install-syft.sh -b /usr/local/bin "${SYFT_VERSION}"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o /tmp/install-trivy.sh
          sh /tmp/install-trivy.sh -b /usr/local/bin "${TRIVY_VERSION}"
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          # Fail here, with a readable version list, rather than midway through
          # a scan step if any installer silently produced nothing.
          gitleaks version
          syft version
          trivy --version
          semgrep --version
          hadolint --version

      - name: Install project dependencies
        run: |
          # make sast resolves the CA bundle through .venv/bin/python and
          # make dep-audit shells out to yarn, so both toolchains have to
          # exist before any scan step runs.
          mkdir -p reports security/sbom
          yarn install --frozen-lockfile || yarn install
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r tests/requirements.txt

      - name: Secret scan
        run: make secrets

      - name: SAST
        run: make sast

      - name: Dependency scan
        run: make sca

      - name: npm/yarn/OSV audit
        run: make dep-audit

      - name: SBOM
        run: make sbom

      - name: Dockerfile lint
        run: make dockerfile-lint

      - name: IaC scan
        run: make iac-scan

      # Runs last, after every evidence file has been written. Pre-commit
      # resolves its own pinned gitleaks/semgrep/hadolint from
      # .pre-commit-config.yaml, so it is a second, independently-versioned
      # failure mode over the same three tools. Ordering it here keeps that
      # check without letting it abort the job before the scans produce the
      # artifact the policy gate depends on.
      - name: Pre-commit security hooks
        run: pre-commit run gitleaks semgrep hadolint-docker --all-files

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-evidence
          path: |
            reports/
            security/sbom/
          if-no-files-found: warn

  container-security:
    name: container image scan
    runs-on: ubuntu-latest
    # Deliberately independent of static-security: the two scans share no
    # inputs, and chaining them meant one static failure skipped this job,
    # so its artifact never existed and release-security-policy died on
    # download-artifact instead of reporting a gate result.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Trivy
        env:
          # Same pin as static-security, so both jobs judge CRITICAL findings
          # with the same vulnerability database schema and scanner behaviour.
          TRIVY_VERSION: "v0.70.0"
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o /tmp/install-trivy.sh
          sh /tmp/install-trivy.sh -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version

      - name: Prepare env
        run: cp .env.example .env

      - name: Build and scan images
        run: make image-scan

      - name: Upload container scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-security-evidence
          path: reports/trivy-images.json
          if-no-files-found: warn

  release-security-policy:
    name: release security policy
    runs-on: ubuntu-latest
    needs: [static-security, container-security]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      # Both downloads tolerate a missing artifact on purpose. An upstream job
      # that failed before writing evidence publishes nothing, and a hard
      # download error hides the actual result behind "Artifact not found".
      # Letting the gate run instead turns that into an explicit
      # "FAIL <gate> - <path> is missing" line.
      - name: Download static evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: security-evidence
          path: .

      - name: Download container evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: container-security-evidence
          path: reports

      - name: Install gate runner
        run: yarn install --frozen-lockfile || yarn install

      - name: Evaluate release security policy
        run: yarn gate:security
