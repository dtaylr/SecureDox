[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securedox-observability"
version = "0.1.0"
description = "Metrics, PII redaction and correlation plumbing shared by SecureDox services"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.21",
    "securedox-shared",
]

[project.optional-dependencies]
# Tracing degrades to a no-op without these; installed only where a collector exists.
otel = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[tool.hatch.build.targets.wheel]
packages = ["securedox_observability"]
