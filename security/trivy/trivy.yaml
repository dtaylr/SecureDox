format: json
ignorefile: security/trivy/.trivyignore.yaml
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
ignore-unfixed: false
timeout: 10m
exit-code: 1
scanners:
  - vuln
  - secret
  - misconfig
  - license
pkg:
  types:
    - os
    - library
misconfiguration:
  include-non-failures: false
  trace: false
license:
  forbidden:
    - GPL-3.0
    - AGPL-3.0
    - SSPL-1.0
