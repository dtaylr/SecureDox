name: release-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile || yarn install
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r tests/requirements.txt

      - name: Install scanner CLIs
        # `shell: bash` adds `-o pipefail`, so a failed download in any
        # `curl | sh` installer fails the step instead of silently no-op'ing.
        shell: bash
        env:
          # Matches the gitleaks rev pinned in .pre-commit-config.yaml.
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          python -m pip install semgrep
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Prepare local stack
        run: |
          cp .env.example .env
          docker compose -f infra/docker/docker-compose.yml --env-file .env up -d --build --wait api worker web
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Generate available quality evidence
        continue-on-error: true
        run: |
          mkdir -p reports tests/reports
          status=0
          run_evidence() {
            "$@" || status=$?
          }
          run_evidence .venv/bin/python -m pytest tests/api -v --junitxml=reports/junit-api.xml
          run_evidence .venv/bin/python -m pytest tests/db -v --junitxml=reports/junit-db.xml
          run_evidence .venv/bin/python -m pytest tests/security -v --junitxml=reports/junit-security.xml
          run_evidence .venv/bin/python -m pytest tests/ocr -v --junitxml=reports/junit-ocr.xml
          run_evidence .venv/bin/python -m pytest tests/observability -v --junitxml=reports/junit-observability.xml
          run_evidence yarn test:e2e
          run_evidence yarn test:security
          run_evidence yarn test:contract
          run_evidence yarn test:mcp
          run_evidence yarn test:agents
          exit "$status"

      - name: Generate available security evidence
        continue-on-error: true
        run: |
          status=0
          run_evidence() {
            "$@" || status=$?
          }
          run_evidence make secrets
          run_evidence make sast
          run_evidence make sca
          run_evidence make sbom
          run_evidence make image-scan
          exit "$status"

      - name: Generate release readiness summary
        run: yarn gate:release

      - name: Stop local stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env down -v

      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: |
            reports/
            reports/release-readiness.json
            reports/release-readiness.prom
            tests/reports/
            security/sbom/
          if-no-files-found: error
