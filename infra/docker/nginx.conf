limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;

map $http_x_correlation_id $securedox_correlation_id {
  default $http_x_correlation_id;
  "" $request_id;
}

upstream securedox_api {
  server api:8000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

upstream securedox_web {
  server web:3000 max_fails=3 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  location /api/ {
    limit_req zone=api_per_ip burst=30 nodelay;
    proxy_pass http://securedox_api;
    proxy_http_version 1.1;
    proxy_set_header Host securedox.local;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Correlation-ID $securedox_correlation_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /api/v1/auth/login {
    limit_req zone=auth_per_ip burst=5 nodelay;
    proxy_pass http://securedox_api;
    proxy_http_version 1.1;
    proxy_set_header Host securedox.local;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Correlation-ID $securedox_correlation_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://securedox_api/health;
    access_log off;
  }

  location /ready {
    proxy_pass http://securedox_api/ready;
    access_log off;
  }

  location /metrics {
    proxy_pass http://securedox_api/metrics;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;
  }

  location / {
    proxy_pass http://securedox_web;
    proxy_http_version 1.1;
    proxy_set_header Host securedox.local;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Correlation-ID $securedox_correlation_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
