apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: securedox
  annotations:
    checkov.io/skip1: CKV_K8S_15=Minikube uses preloaded local images with IfNotPresent.
    checkov.io/skip2: CKV_K8S_43=Local development images are mutable and are not pinned by digest.
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      containers:
        - name: web
          image: docker.io/securedox/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - { name: VITE_API_BASE_URL, value: http://securedox.local }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - { name: web-vite-cache, mountPath: /app/apps/web/node_modules/.vite }
            - { name: web-tmp, mountPath: /tmp }
      volumes:
        - { name: web-vite-cache, emptyDir: {} }
        - { name: web-tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: securedox
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
