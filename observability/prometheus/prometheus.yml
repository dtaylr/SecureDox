global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: securedox-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service_name: securedox-api

  - job_name: securedox-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service_name: securedox-worker
